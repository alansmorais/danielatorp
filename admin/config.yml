local_backend: true
backend:
  name: github
  repo: alansmorais/danielatorp
  branch: main 

media_folder: "wp-content/uploads"
public_folder: "/wp-content/uploads"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - label: "Homepage Text"
        name: "homepage"
        file: "data.json"
        format: "json"
        fields:
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "text" }
          - { label: "About Title", name: "about_title", widget: "string" }
          - { label: "About Text", name: "about_text", widget: "text" }
