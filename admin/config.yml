
local_backend: true
backend:
  name: github
  repo: alansmorais/danielatorp
  branch: main 

media_folder: "wp-content/uploads"
public_folder: "/wp-content/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Homepage"
        name: "home"
        file: "index.html"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
