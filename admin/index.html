<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Page Preview</title>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      const FullWebsitePreview = createClass({
        render: function() {
          const { entry } = this.props;
          const data = entry.get('data');

          const heroTitle = data.get('hero_title') || '';
          const heroSubtitle = data.get('hero_subtitle') || '';
          const heroSubtitle2 = data.get('hero_subtitle_2') || '';
          const datesTitle = data.get('dates_title') || '';
          const date1 = data.get('date_1') || '';
          const date2 = data.get('date_2') || '';
          const date3 = data.get('date_3') || '';
          const date4 = data.get('date_4') || '';
          const date5 = data.get('date_5') || '';

          const pillar1 = data.get('pillar_1') || '';
          const pillar2 = data.get('pillar_2') || '';
          const pillar3 = data.get('pillar_3') || '';
          const pillar4 = data.get('pillar_4') || '';
          const pillar5 = data.get('pillar_5') || '';
          const pillar6 = data.get('pillar_6') || '';

          const aboutTitle = data.get('about_title') || '';
          const aboutP1 = data.get('about_p1') || '';
          const aboutP2 = data.get('about_p2') || '';
          const aboutP3 = data.get('about_p3') || '';

          const w1Title = data.get('workshop_1_title') || '';
          const w1Desc = data.get('workshop_1_desc') || '';
          const w2Title = data.get('workshop_2_title') || '';
          const w2Desc = data.get('workshop_2_desc') || '';
          const w3Title = data.get('workshop_3_title') || '';
          const w3Desc = data.get('workshop_3_desc') || '';

          return h('div', { 
            style: { 
              fontFamily: "'Roboto', Arial, sans-serif", 
              color: '#080808', 
              background: '#fff',
              fontSize: '14px',
              lineHeight: '1.6'
            } 
          },
            
            // 1. Header Navigation Bar
            h('div', { style: { height: '47px', background: '#fff', borderBottom: '1px solid #eee', display: 'flex', alignItems: 'center', padding: '0 20px', fontSize: '11px', color: '#948f8f' } },
              h('span', { style: { fontWeight: 'bold', color: '#111', marginRight: 'auto' } }, 'Daniela Torp'),
              h('span', {}, 'Hjem  •  6 pilarer  •  Hvem er Daniela  •  Workshoper  •  Kontakt  •  🇳🇴')
            ),

            // 2. Hero Section
            h('section', { 
              style: { 
                textAlign: 'center', 
                padding: '50px 20px', 
                background: 'linear-gradient(90deg, #f9dbe3 0%, #f8d7e1 31%, #fff 49%, #d7f0f3 71%, #d5eff2 100%)' 
              } 
            },
              h('div', { style: { maxWidth: '555px', margin: 'auto' } },
                h('h1', { style: { fontSize: '24px', fontWeight: '700', margin: '0 0 13px' } }, heroTitle),
                h('p', { style: { fontSize: '12px', lineHeight: '1.6', margin: '0 0 10px' } }, heroSubtitle),
                h('p', { style: { fontSize: '12px', lineHeight: '1.6', margin: '0 0 20px' } }, heroSubtitle2),
                
                // Dates Box
                h('div', { style: { border: '1px solid #ee5a7a', padding: '12px', background: 'rgba(255,255,255,0.6)', textAlign: 'left', fontSize: '11px', lineHeight: '1.8' } },
                  h('h3', { style: { fontSize: '14px', margin: '0 0 6px', fontWeight: '700' } }, datesTitle),
                  h('div', {}, date1),
                  h('div', { style: { color: '#e9476b', fontWeight: '700' } }, date2),
                  h('div', { style: { color: '#e9476b', fontWeight: '700' } }, date3),
                  h('div', { style: { color: '#e9476b', fontWeight: '700' } }, date4),
                  h('div', { style: { color: '#e9476b', fontWeight: '700' } }, date5)
                )
              )
            ),

            // 3. Pillars Grid Preview
            h('section', { style: { padding: '30px 10px', background: 'linear-gradient(90deg, #f8dce4 0%, #fff 50%, #d8f0f2 100%)', textAlign: 'center' } },
              h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px', maxWidth: '600px', margin: 'auto' } },
                h('div', { style: { background: '#fff', padding: '10px', fontSize: '10px' } }, pillar1),
                h('div', { style: { background: '#fff', padding: '10px', fontSize: '10px' } }, pillar2),
                h('div', { style: { background: '#fff', padding: '10px', fontSize: '10px' } }, pillar3),
                h('div', { style: { background: '#fff', padding: '10px', fontSize: '10px' } }, pillar4),
                h('div', { style: { background: '#fff', padding: '10px', fontSize: '10px' } }, pillar5),
                h('div', { style: { background: '#fff', padding: '10px', fontSize: '10px' } }, pillar6)
              )
            ),

            // 4. About Section
            h('section', { style: { padding: '50px 20px', background: '#fff' } },
              h('div', { style: { maxWidth: '700px', margin: 'auto' } },
                h('h2', { style: { fontSize: '24px', fontWeight: '300', margin: '0 0 15px' } }, aboutTitle),
                h('p', { style: { fontSize: '13px', lineHeight: '1.6', color: '#9b9291', marginBottom: '10px' } }, aboutP1),
                h('p', { style: { fontSize: '13px', lineHeight: '1.6', color: '#9b9291', marginBottom: '10px', fontWeight: 'bold' } }, aboutP2),
                h('p', { style: { fontSize: '13px', lineHeight: '1.6', color: '#9b9291' } }, aboutP3)
              )
            ),

            // 5. Workshops Cards Preview
            h('section', { style: { padding: '50px 20px', background: '#fafafa', textAlign: 'center' } },
              h('h2', { style: { fontSize: '24px', fontWeight: '300', marginBottom: '20px' } }, 'Workshoper'),
              h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '15px', maxWidth: '800px', margin: 'auto', textAlign: 'left' } },
                h('div', { style: { background: '#fff', padding: '15px', border: '1px solid #ddd' } },
                  h('h3', { style: { fontSize: '14px', margin: '0 0 5px' } }, w1Title),
                  h('p', { style: { fontSize: '11px', color: '#777', margin: 0 } }, w1Desc)
                ),
                h('div', { style: { background: '#fff', padding: '15px', border: '1px solid #ddd' } },
                  h('h3', { style: { fontSize: '14px', margin: '0 0 5px' } }, w2Title),
                  h('p', { style: { fontSize: '11px', color: '#777', margin: 0 } }, w2Desc)
                ),
                h('div', { style: { background: '#fff', padding: '15px', border: '1px solid #ddd' } },
                  h('h3', { style: { fontSize: '14px', margin: '0 0 5px' } }, w3Title),
                  h('p', { style: { fontSize: '11px', color: '#777', margin: 0 } }, w3Desc)
                )
              )
            ),

            // 6. Footer
            h('div', { style: { padding: '30px', textAlign: 'center', background: '#fff', borderTop: '1px solid #eee', fontSize: '11px', color: '#aaa' } },
              '© 2026 Alle rettigheter forbeholdt | Daniela Torp'
            )
          );
        }
      });

      CMS.registerPreviewTemplate('homepage', FullWebsitePreview);
    </script>
  </body>
</html>
